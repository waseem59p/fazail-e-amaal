<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
<meta name="theme-color" content="#0a1f44">
<title>فضائلِ اعمال — مکمل کتاب</title>
<style>
  :root {
    --gold: #c9a96e;
    --gold-light: #efd6a1;
    --gold-dark: #a9874f;
    --navy: #123a32;
    --navy-light: #18483e;
    --navy-dark: #0c241f;
    --bg: #101916;
    --panel: #17241f;
    --panel-2: #20332c;
    --text: #f3efe5;
    --text-muted: #a2b0a6;
    --star: #e7bc67;
    --danger: #e05252;
    --success: #2e9e6b;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", "Amiri", serif;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px; height: 42px; padding: 0 14px;
    border-radius: 10px; border: 1px solid var(--gold);
    background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    color: #fff;
    font-family: "Noto Nastaliq Urdu", Arial, sans-serif;
    font-size: 13px; font-weight: 600; line-height: 1;
    cursor: pointer; transition: all .18s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 2px 8px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
    white-space: nowrap; user-select: none; flex-shrink: 0;
  }
  .btn svg { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .btn:hover { background: linear-gradient(180deg, rgba(201,162,39,.95), rgba(165,132,28,.95));
    color: var(--navy); transform: translateY(-1px); }
  .btn:active { transform: scale(.96); }
  .btn.primary {
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    color: var(--navy); border-color: var(--gold-light); font-weight: 700;
    box-shadow: 0 3px 10px rgba(201,162,39,.4), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .btn.primary:hover { background: linear-gradient(180deg, #f4d876, var(--gold-light)); }
  .btn.icon-only { padding: 0; width: 42px; height: 42px; min-width: 42px; }
  .btn.apk-btn {
    background: linear-gradient(180deg, #2e9e6b, #217a52);
    border-color: #46c98a; color: #fff; font-weight: 700;
  }
  .btn.apk-btn:hover { background: linear-gradient(180deg, #46c98a, #2e9e6b); color: #08120e; }
  .btn.apk-btn:disabled { opacity: .6; cursor: not-allowed; }

  .topbar {
    flex: 0 0 auto;
    background: linear-gradient(180deg, var(--navy-light), var(--navy));
    border-bottom: 1px solid rgba(201,162,39,.4);
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; padding-top: calc(8px + var(--safe-top));
    z-index: 50; flex-wrap: wrap;
    box-shadow: 0 3px 20px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .topbar .brand { display: flex; align-items: center; gap: 10px; font-size: 15px;
    font-weight: 700; color: var(--gold-light); white-space: nowrap; flex-shrink: 0; }
  .topbar .brand svg { width: 28px; height: 28px; stroke: var(--gold-light); fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 2px 4px rgba(201,162,39,.4)); }
  .topbar .spacer { flex: 1; min-width: 8px; }
  .topbar .zoom-badge { font-size: 11px;
    background: linear-gradient(180deg, rgba(201,162,39,.3), rgba(201,162,39,.15));
    border: 1px solid rgba(201,162,39,.5); color: var(--gold-light);
    padding: 5px 12px; border-radius: 20px;
    font-family: 'SF Mono', Menlo, monospace; font-weight: 700; white-space: nowrap; }

  .viewer {
    flex: 1 1 auto; position: relative; overflow: hidden;
    background: radial-gradient(circle at 30% 20%, rgba(201,162,39,.05), transparent 50%),
      radial-gradient(circle at 70% 80%, rgba(18,42,86,.5), transparent 50%), var(--bg);
    display: flex; align-items: center; justify-content: center; touch-action: none;
  }
  .viewer-inner { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; overflow: hidden; }
  #pdfCanvasWrap { position: relative; transform-origin: center center;
    transition: transform .12s ease-out; will-change: transform;
    display: flex; align-items: center; justify-content: center; }
  #pdfCanvas { display: block; background: #fff;
    box-shadow: 0 8px 50px rgba(0,0,0,.85), 0 0 0 1px rgba(201,162,39,.2);
    border-radius: 4px; max-width: none; user-select: none; -webkit-user-drag: none;
    image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges; }
  .loader { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(10,15,26,.97); z-index: 100; gap: 22px;
    color: var(--gold-light); font-size: 15px; padding: 20px; text-align: center; }
  .loader.hidden { display: none; }
  .spinner { width: 56px; height: 56px;
    border: 4px solid rgba(201,162,39,.2); border-top-color: var(--gold);
    border-radius: 50%; animation: spin 1s linear infinite;
    box-shadow: 0 0 24px rgba(201,162,39,.35); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .page-flip { animation: flipAnim .28s ease-out; }
  @keyframes flipAnim { 0% { opacity: 0; transform: scale(.97); } 100% { opacity: 1; transform: scale(1); } }
  .edge-hint { position: absolute; top: 50%; transform: translateY(-50%);
    width: 48px; height: 48px; border-radius: 50%;
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    color: var(--navy); display: flex; align-items: center; justify-content: center;
    pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 20;
    box-shadow: 0 6px 20px rgba(201,162,39,.5); }
  .edge-hint svg { width: 22px; height: 22px; fill: none; stroke: currentColor;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .edge-hint.left { left: 14px; }
  .edge-hint.right { right: 14px; }
  .edge-hint.show { opacity: .95; }

  .bottombar {
    flex: 0 0 auto;
    background: linear-gradient(0deg, var(--navy-light), var(--navy));
    border-top: 1px solid rgba(201,162,39,.4);
    display: flex; align-items: center; justify-content: center;
    gap: 8px; padding: 8px 12px;
    padding-bottom: calc(8px + var(--safe-bottom));
    z-index: 50; flex-wrap: wrap;
    box-shadow: 0 -3px 20px rgba(0,0,0,.5), inset 0 -1px 0 rgba(255,255,255,.06);
  }
  .bottombar .btn { height: 46px; min-width: 46px; padding: 0 14px; font-size: 14px; }
  .bottombar .btn svg { width: 20px; height: 20px; }
  .page-input {
    display: flex; align-items: center; gap: 8px;
    background: linear-gradient(180deg, rgba(0,0,0,.4), rgba(0,0,0,.25));
    border: 1px solid rgba(201,162,39,.5); border-radius: 10px;
    padding: 0 12px; height: 46px; box-shadow: inset 0 1px 3px rgba(0,0,0,.4);
    position: relative;
  }
  .page-input input { width: 62px; height: 34px; text-align: center;
    border: 1px solid rgba(201,162,39,.3);
    background: linear-gradient(180deg, #fff, #f0f2f6); color: var(--navy);
    border-radius: 7px; font-size: 15px; font-weight: 800;
    font-family: 'SF Mono', Menlo, monospace; outline: none;
    direction: ltr; -moz-appearance: textfield; appearance: textfield; }
  .page-input input::-webkit-outer-spin-button,
  .page-input input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .page-input input:focus { box-shadow: 0 0 0 2px rgba(201,162,39,.6); }
  .page-input .separator { font-size: 13px; color: var(--gold-light); font-weight: 600; opacity: .7; }
  .page-input .total { font-size: 13px; color: var(--gold-light); font-weight: 700;
    font-family: 'SF Mono', Menlo, monospace; min-width: 24px; text-align: center; }
  .page-indicator { font-size: 12.5px; color: var(--gold-light); font-weight: 600;
    white-space: nowrap; padding: 0 10px; font-family: Arial, sans-serif; opacity: .85; }

  .page-clear-btn {
    display: none;
    position: absolute;
    left: 6px; top: 50%; transform: translateY(-50%);
    width: 24px; height: 24px;
    border-radius: 50%; border: none;
    background: rgba(224,82,82,.85); color: #fff;
    cursor: pointer; padding: 0;
    align-items: center; justify-content: center;
    z-index: 2;
  }
  .page-clear-btn.show { display: flex; }
  .page-clear-btn svg { width: 12px; height: 12px; stroke: #fff; stroke-width: 3; fill: none;
    stroke-linecap: round; }

  .drawer-overlay, .sheet-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.75);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none; transition: opacity .25s; }
  .drawer-overlay { z-index: 200; }
  .sheet-overlay { z-index: 300; }
  .drawer-overlay.show, .sheet-overlay.show { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed; top: 0; right: -460px; width: min(460px, 94vw); height: 100%;
    background: linear-gradient(180deg, var(--panel), var(--navy-dark));
    border-left: 2px solid var(--gold);
    display: flex; flex-direction: column;
    transition: right .32s cubic-bezier(.4,0,.2,1);
    box-shadow: -10px 0 50px rgba(0,0,0,.85);
    padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);
  }
  .drawer { z-index: 201; }
  .drawer.show { right: 0; }
  .drawer-header {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px;
    background: linear-gradient(180deg, var(--navy-light), var(--navy));
    border-bottom: 1px solid rgba(201,162,39,.5); }
  .drawer-header h2 { font-size: 16px; color: var(--gold-light);
    display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .drawer-header h2 svg { width: 22px; height: 22px;
    fill: none; stroke: var(--gold-light); stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; }
  .drawer-header h2 svg { fill: var(--gold-light); stroke-width: 1.5; }

  .drawer-body { flex: 1 1 auto; overflow-y: auto; padding: 14px;
    display: flex; flex-direction: column; gap: 12px; }
  .drawer-body::-webkit-scrollbar { width: 8px; }
  .drawer-body::-webkit-scrollbar-thumb {
    background: var(--gold); border-radius: 4px; }

  .fav-empty { text-align: center; color: var(--text-muted);
    padding: 50px 20px; font-size: 14px; line-height: 2; }
  .fav-empty .big { margin-bottom: 18px; opacity: .35; }
  .fav-empty .big svg { width: 60px; height: 60px;
    stroke: var(--gold); fill: none; stroke-width: 1.4; }

  .fav-item {
    display: flex; align-items: center; gap: 12px; padding: 14px;
    background: linear-gradient(180deg, var(--panel-2), rgba(26,40,66,.7));
    border: 1px solid rgba(201,162,39,.3); border-radius: 14px;
    transition: all .18s; cursor: pointer; }
  .fav-item:hover { border-color: var(--gold); transform: translateX(-3px); }
  .fav-item .fav-star { flex-shrink: 0; color: var(--star); display: flex; align-items: center; }
  .fav-item .fav-star svg { width: 26px; height: 26px;
    fill: var(--star); stroke: var(--star); stroke-width: 1.5; }
  .fav-item .fav-info { flex: 1; min-width: 0; }
  .fav-item .fav-page { font-size: 16px; font-weight: 800; color: var(--gold-light);
    font-family: 'SF Mono', Menlo, monospace; letter-spacing: .3px; }
  .fav-item .fav-label { font-size: 11.5px; color: var(--text-muted); margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fav-item .fav-del { flex-shrink: 0; width: 38px; height: 38px;
    border-radius: 8px; border: 1px solid rgba(224,82,82,.5);
    background: linear-gradient(180deg, rgba(224,82,82,.2), rgba(224,82,82,.1));
    color: var(--danger); cursor: pointer;
    display: flex; align-items: center; justify-content: center; }
  .fav-item .fav-del svg { width: 17px; height: 17px; fill: none;
    stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; }
  .fav-item .fav-del:hover { background: var(--danger); color: #fff; }

.sheet {
    position: fixed; left: 50%; bottom: -600px; transform: translateX(-50%);
    width: min(500px, 94vw); max-height: 85vh;
    background: linear-gradient(180deg, var(--panel), var(--navy-dark));
    border: 1px solid var(--gold); border-bottom: none;
    border-radius: 20px 20px 0 0; z-index: 301;
    transition: bottom .32s cubic-bezier(.4,0,.2,1);
    padding: 24px 20px; padding-bottom: calc(24px + var(--safe-bottom));
    overflow-y: auto; }
  .sheet.show { bottom: 0; }
  .sheet h3 { color: var(--gold-light); font-size: 17px; margin-bottom: 20px;
    text-align: center; display: flex; align-items: center; justify-content: center;
    gap: 10px; font-weight: 700; }
  .sheet h3 svg { width: 22px; height: 22px; fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sheet .sheet-buttons { display: flex; flex-direction: column; gap: 12px; }
  .sheet .sheet-buttons button {
    display: flex; align-items: center; justify-content: flex-start; gap: 12px;
    min-height: 60px; height: auto; padding: 14px 18px; border-radius: 12px;
    border: 1px solid var(--gold);
    background: linear-gradient(180deg, rgba(201,162,39,.12), rgba(201,162,39,.06));
    color: #fff; font-family: "Noto Nastaliq Urdu", Arial, sans-serif;
    font-size: 14.5px; font-weight: 600; line-height: 1.5; text-align: right;
    cursor: pointer; overflow: hidden; word-wrap: break-word; }
  .sheet .sheet-buttons button svg { width: 22px; height: 22px; fill: none;
    stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    flex-shrink: 0; }
  .sheet .sheet-buttons button:hover {
    background: linear-gradient(180deg, var(--gold-light), var(--gold)); color: var(--navy); }
  .sheet .sheet-buttons button.primary {
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    color: var(--navy); border-color: var(--gold-light); font-weight: 700; }
  .sheet .sheet-buttons button.close-btn {
    background: linear-gradient(180deg, rgba(224,82,82,.2), rgba(224,82,82,.1));
    border-color: rgba(224,82,82,.5); color: #ff8a8a; justify-content: center; }
  .sheet .sheet-buttons button.close-btn:hover { background: var(--danger); color: #fff; }

  .toast {
    position: fixed; bottom: 110px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: linear-gradient(180deg, var(--navy-light), var(--navy));
    color: var(--gold-light); padding: 13px 26px; border-radius: 26px;
    border: 1px solid rgba(201,162,39,.6); font-size: 14px; font-weight: 600;
    z-index: 9999; opacity: 0; pointer-events: none; transition: all .3s;
    white-space: nowrap; font-family: "Noto Nastaliq Urdu", Arial, sans-serif;
    max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .zoom-hint { position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(.9);
    background: linear-gradient(180deg, var(--navy-light), var(--navy));
    color: var(--gold-light); padding: 22px 30px; border-radius: 18px;
    border: 1px solid var(--gold); font-size: 14px; text-align: center;
    z-index: 500; opacity: 0; pointer-events: none; transition: all .3s;
    line-height: 2; font-family: "Noto Nastaliq Urdu", Arial, sans-serif; }
  .zoom-hint.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .zoom-hint .emoji { display: block; margin-bottom: 14px; }
  .zoom-hint .emoji svg { width: 44px; height: 44px; stroke: var(--gold-light);
    fill: none; stroke-width: 1.4; }

  .back-hint { position: fixed; top: calc(60px + var(--safe-top));
    left: 50%; transform: translateX(-50%) translateY(-20px);
    background: linear-gradient(180deg, var(--navy-light), var(--navy));
    color: var(--gold-light); padding: 8px 16px; border-radius: 20px;
    border: 1px solid rgba(201,162,39,.5); font-size: 11px; font-weight: 700;
    z-index: 9998; opacity: 0; pointer-events: none; transition: all .25s;
    display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .back-hint.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .back-hint svg { width: 14px; height: 14px; fill: none; stroke: currentColor;
    stroke-width: 2.5; stroke-linecap: round; }

  @media (max-width: 700px) {
    .topbar { padding: 8px; gap: 6px; padding-top: calc(8px + var(--safe-top)); }
    .topbar .brand { font-size: 13px; }
    .topbar .brand svg { width: 24px; height: 24px; }
    .topbar .btn { height: 38px; padding: 0 10px; font-size: 12px; gap: 6px; }
    .topbar .btn svg { width: 16px; height: 16px; }
    .topbar .btn.icon-only { width: 38px; min-width: 38px; }
    .topbar .zoom-badge { font-size: 10px; padding: 4px 9px; }
    .bottombar { padding: 8px; gap: 6px; padding-bottom: calc(8px + var(--safe-bottom)); }
    .bottombar .btn { height: 44px; min-width: 44px; padding: 0 12px; font-size: 13px; }
    .bottombar .btn svg { width: 18px; height: 18px; }
    .bottombar .btn.icon-only { width: 44px; min-width: 44px; }
    .page-input { height: 44px; padding: 0 10px; gap: 6px; }
    .page-input input { width: 52px; height: 32px; font-size: 14px; }
    .page-indicator { font-size: 12px; padding: 0 6px; }
    .brand-text { display: none; }
    .edge-hint { width: 40px; height: 40px; }
    .edge-hint svg { width: 18px; height: 18px; }
    .drawer { width: 100%; }
    .sheet .sheet-buttons button { font-size: 13.5px; min-height: 56px; padding: 12px 16px; }
  }
  @media (max-width: 400px) {
    .topbar .btn span:not(.keep) { display: none; }
    .topbar .btn { padding: 0; width: 38px; min-width: 38px; justify-content: center; }
    .sheet .sheet-buttons button { font-size: 13px; min-height: 54px; }
  }

  :root { color-scheme: dark; }
  html, body { font-family: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", "Amiri", serif; }
  button, input { font: inherit; }
  button:focus-visible, input:focus-visible {
    outline: 3px solid rgba(239,214,161,.78); outline-offset: 2px;
  }
  .topbar, .bottombar {
    background: linear-gradient(180deg, rgba(24,72,62,.98), rgba(18,58,50,.98));
    border-color: rgba(201,169,110,.45);
  }
  .btn { border-color: rgba(201,169,110,.58); border-radius: 12px; }
  .btn.primary, .page-input input { color: #10251f; }
  .viewer { background:
    radial-gradient(ellipse at 50% 0%, rgba(201,169,110,.075), transparent 52%),
    radial-gradient(ellipse at 50% 100%, rgba(24,72,62,.32), transparent 58%), var(--bg); }
  .drawer, .sheet {
    background: linear-gradient(165deg, #1a2923 0%, #10231e 100%);
    border-color: rgba(201,169,110,.72);
  }
  .drawer-header {
    background: linear-gradient(180deg, #1c4c40, #153b33);
    border-bottom-color: rgba(201,169,110,.38);
  }
.fav-item {
    background: linear-gradient(145deg, rgba(35,55,46,.96), rgba(26,43,36,.96));
    border-color: rgba(201,169,110,.2); border-radius: 16px;
  }
.page-input { border-color: rgba(201,169,110,.38); }
  .page-input input { border-color: rgba(201,169,110,.38); }
  .toast { background: #1b4035; color: #f4dfb4; border-color: rgba(201,169,110,.55); }
  .loader { background: rgba(12,24,20,.97); }

  /* ============================================================
     MOBILE TOPBAR — 9 columns so APK button text fits
     ============================================================ */
  @media (max-width: 700px) {
    body { min-height: 100dvh; }
    .topbar {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 6px; padding: 8px; padding-top: calc(8px + var(--safe-top));
      flex-wrap: initial; overflow: visible;
    }
    .topbar .brand { grid-column: 1 / span 4; min-height: 34px; font-size: 14px; }
    .brand-text { display: inline; }
    .topbar .spacer { display: none; }
    .topbar .zoom-badge { grid-column: 5 / span 4; justify-self: end; align-self: center; }

    .topbar > .btn {
      position: relative; width: 100%; min-width: 0; height: 42px; padding: 0;
      border-radius: 12px; justify-content: center;
    }

    /* Hide text on all buttons EXCEPT #favCount and #apkBtnText */
    .topbar > .btn span:not(#favCount):not(#apkBtnText) { display: none; }
    .topbar > .btn svg { width: 19px; height: 19px; }

    /* APK button gets its own row, full width, with text visible */
    .topbar > .btn.apk-btn {
      grid-column: 1 / -1;
      height: 44px;
      gap: 8px;
      font-size: 13.5px;
      padding: 0 14px;
    }
    .topbar > .btn.apk-btn svg { width: 20px; height: 20px; }
    .topbar > .btn.apk-btn #apkBtnText { display: inline; }

    .topbar #favCount {
      position: absolute; top: -4px; left: -3px; z-index: 1;
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 16px; height: 16px; padding: 0 4px; font-size: 9px;
      border: 1px solid var(--navy); box-shadow: 0 2px 5px rgba(0,0,0,.35);
    }
    .bottombar {
      display: grid; grid-template-columns: 40px 40px minmax(90px, 1fr) 40px 40px;
      gap: 6px; padding: 8px; padding-bottom: calc(8px + var(--safe-bottom));
    }
    .bottombar .btn { width: 40px; min-width: 40px; height: 42px; padding: 0; }
    .page-input { width: 100%; min-width: 0; height: 42px; justify-content: center; padding: 0 6px; gap: 5px; }

    .page-indicator { display: none; }
    .drawer { top: 0; bottom: 0; height: 100dvh; max-height: 100dvh; }
.sheet { max-height: min(85dvh, 720px); }
  }
  @media (max-width: 360px) {
    .topbar { gap: 4px; padding-inline: 6px; }
    .topbar > .btn { height: 40px; }
    .topbar .brand { font-size: 13px; gap: 7px; }

  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<!-- PDF.js from CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  /* CONFIG */
  const PDF_URL = 'fazail.pdf';

  // APK download link — GitHub Releases (encoded Unicode filename)
  const APK_URL = 'https://github.com/waseem59p/fazail-e-amaal/releases/download/%EA%9C%B0%E1%B4%80%E1%B4%A2%E1%B4%80%C9%AA%CA%9F-%E1%B4%87-%E1%B4%80%E1%B4%8D%E1%B4%80%E1%B4%80%CA%9F(%E1%B4%9C%CA%80%E1%B4%85%E1%B4%9C)_3.1/_3.1.apk';
  const APK_FILENAME = 'Fazail-e-Amaal.apk';
  const APK_LABEL_DEFAULT = 'آف لائن ایپ ڈاؤن لوڈ';

  const STORAGE_KEY = 'fazail-e-amaal-favorites-v9';
  const LAST_PAGE_KEY = 'fazail-e-amaal-last-page-v9';
  const ZOOM_KEY = 'fazail-e-amaal-zoom-v9';

  /* PDF.js worker from CDN */
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  /* STATE */
  let pdfDoc = null;
  let currentPage = 1;
  let totalPages = 0;
  let scale = 1.2;
  let baseScale = 1.0;
  let pageRendering = false;
  let pendingPage = null;
  let favorites = [];
  let currentPageLabel = '';
  let panX = 0, panY = 0;
  let isPanning = false;
  let pinchStartDist = 0;
  let pinchStartScale = 1.2;
  let lastTouchX = 0, lastTouchY = 0;
  let touchStartTime = 0;
  let touchStartX = 0, touchStartY = 0;
  let isSwiping = false;
  let isSaving = false;
  let isDownloadingApk = false;

  /* DOUBLE BACK TO EXIT */
  let backPressCount = 0;
  let backPressTimer = null;
  let suppressNextPopState = false;

  const backStack = [];
  let backHintTimer = null;

  function pushBackHandler(fn) {
    backStack.push(fn);
    try { history.pushState({ ov: backStack.length }, ''); } catch(e) {}
    showBackHint();
  }
  function popBackHandler() {
    const fn = backStack.pop();
    if (fn) try { fn(); } catch(e) {}
    if (backStack.length === 0) hideBackHint();
  }
  function showBackHint() {
    const hint = document.getElementById('backHint');
    if (!hint) return;
    hint.classList.add('show');
    clearTimeout(backHintTimer);
    backHintTimer = setTimeout(hideBackHint, 3000);
  }
  function hideBackHint() {
    const hint = document.getElementById('backHint');
    if (hint) hint.classList.remove('show');
  }
  function closeWithBack(fn) {
    if (backStack.length > 0) {
      backStack.pop();
      try { fn(); } catch(e) {}
      suppressNextPopState = true;
      try { history.back(); } catch(e) { suppressNextPopState = false; }
    } else {
      try { fn(); } catch(e) {}
    }
    if (backStack.length === 0) hideBackHint();
  }

  window.addEventListener('popstate', (e) => {
    if (suppressNextPopState) {
      suppressNextPopState = false;
      try { history.pushState({ ov: backStack.length }, ''); } catch(err) {}
      return;
    }
    if (isSaving || isDownloadingApk) {
      backPressCount = 0;
      showToast('کام جاری ہے؛ مکمل ہونے تک انتظار کریں');
      try { history.pushState({ saving: true }, ''); } catch(err) {}
      return;
    }

    if (backStack.length > 0) {
      popBackHandler();
      try { history.pushState({ ov: backStack.length }, ''); } catch(err) {}
      return;
    }

    if (backPressCount === 0) {
      backPressCount = 1;
      showToast('ایپ بند کرنے کے لیے دوبارہ back دبائیں', 2000);
      clearTimeout(backPressTimer);
      backPressTimer = setTimeout(() => { backPressCount = 0; }, 2000);
    } else {
      clearTimeout(backPressTimer);
      backPressCount = 0;
      let finished = false;
      try {
        if (typeof Android !== 'undefined') {
          if (typeof Android.finish === 'function') { Android.finish(); finished = true; }
          else if (typeof Android.exitApp === 'function') { Android.exitApp(); finished = true; }
          else if (typeof Android.closeApp === 'function') { Android.closeApp(); finished = true; }
        }
      } catch(e) {}
      try {
        if (!finished && typeof window.AndroidExit === 'function') {
          window.AndroidExit(); finished = true;
        }
      } catch(e) {}
      try {
        if (!finished) { window.history.go(-10); finished = true; }
      } catch(e) {}
      if (!finished) {
        showToast('ایپ بند کرنے کے لیے ہوم بٹن دبائیں', 2500);
      }
    }
    try { history.pushState({ ov: 0 }, ''); } catch(err) {}
  });

  /* DOM */
  const canvas = document.getElementById('pdfCanvas');
  const viewerInner = document.getElementById('viewerInner');
  const wrap = document.getElementById('pdfCanvasWrap');
  const loader = document.getElementById('loader');
  const loaderText = document.getElementById('loaderText');
  const pageInput = document.getElementById('pageInput');
  const totalPagesEl = document.getElementById('totalPages');
  const pageIndicator = document.getElementById('pageIndicator');
  const favList = document.getElementById('favList');
  const favCount = document.getElementById('favCount');
  const favBtnText = document.getElementById('favBtnText');
  const toast = document.getElementById('toast');
  const zoomHint = document.getElementById('zoomHint');
  const zoomBadge = document.getElementById('zoomBadge');
  const edgeHintLeft = document.getElementById('edgeHintLeft');
  const edgeHintRight = document.getElementById('edgeHintRight');
  const apkBtn = document.getElementById('apkBtn');
  const apkBtnText = document.getElementById('apkBtnText');

  /* TOAST */
  let toastTimer;
  function showToast(msg, ms = 2200) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), ms);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* =========================================================
     APK DOWNLOAD — fetch + blob (proper filename) + fallback
     ========================================================= */
  function setApkBtnState(loading, label) {
    if (!apkBtn) return;
    apkBtn.disabled = !!loading;
    if (apkBtnText) apkBtnText.textContent = label || APK_LABEL_DEFAULT;
  }

  async function downloadAPK() {
    if (isDownloadingApk) return;

    // Native bridge (agar future me APK ke andar chalega)
    if (typeof Android !== 'undefined' && typeof Android.downloadApk === 'function') {
      try {
        Android.downloadApk(APK_URL);
        showToast('APK ڈاؤن لوڈ شروع ہو گیا');
        return;
      } catch (e) { /* fallback to web */ }
    }

    isDownloadingApk = true;
    setApkBtnState(true, '…');
    showToast('APK ڈاؤن لوڈ ہو رہا ہے…', 60000);

    try {
      const res = await fetch(APK_URL, { cache: 'no-store', redirect: 'follow' });
      if (!res.ok) throw new Error('HTTP ' + res.status);

      const total = parseInt(res.headers.get('content-length') || '0', 10);

      if (res.body && res.body.getReader) {
        const reader = res.body.getReader();
        const chunks = [];
        let received = 0;
        let lastPct = -1;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          received += value.length;

          if (total > 0) {
            const pct = Math.min(99, Math.floor((received / total) * 100));
            if (pct !== lastPct) {
              lastPct = pct;
              showToast('APK ڈاؤن لوڈ… ' + pct + '%', 60000);
              if (apkBtnText) apkBtnText.textContent = pct + '%';
            }
          } else {
            const mb = (received / 1048576).toFixed(1);
            showToast('APK ڈاؤن لوڈ… ' + mb + ' MB', 60000);
          }
        }

        const blob = new Blob(chunks, { type: 'application/vnd.android.package-archive' });
        triggerBlobDownload(blob, APK_FILENAME);
      } else {
        const blob = await res.blob();
        triggerBlobDownload(blob, APK_FILENAME);
      }

      showToast('✅ APK محفوظ ہو گیا — Install کریں', 3500);
    } catch (err) {
      console.warn('APK fetch failed, using direct link:', err);
      const a = document.createElement('a');
      a.href = APK_URL;
      a.download = APK_FILENAME;
      a.rel = 'noopener';
      a.target = '_blank';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        if (a.parentNode) a.parentNode.removeChild(a);
      }, 800);
      showToast('APK ڈاؤن لوڈ شروع ہو گیا', 3000);
    } finally {
      isDownloadingApk = false;
      setApkBtnState(false, APK_LABEL_DEFAULT);
    }
  }

  function triggerBlobDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      if (a.parentNode) a.parentNode.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1000);
  }

  /* FAVORITES */
  function loadFavorites() {
    try {
      favorites = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      favorites = favorites.map(f => ({ page: f.page }))
        .filter(f => f.page && typeof f.page === 'number');
    } catch (e) { favorites = []; }
    updateFavUI();
  }
  function saveFavorites() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(favorites)); } catch (e) {}
    updateFavUI();
  }
  function isFavorite(page) { return favorites.some(f => f.page === page); }
  function toggleFavorite() {
    if (!pdfDoc) return;
    const page = currentPage;
    const idx = favorites.findIndex(f => f.page === page);
    if (idx >= 0) {
      favorites.splice(idx, 1);
      saveFavorites();
      showToast('⭐ پسندیدہ سے ہٹا دیا');
    } else {
      favorites.push({ page: page });
      favorites.sort((a, b) => a.page - b.page);
      saveFavorites();
      showToast('⭐ صفحہ ' + getDisplayPage(page) + ' پسندیدہ میں شامل');
    }
  }
  function removeFavorite(page) {
    const idx = favorites.findIndex(f => f.page === page);
    if (idx >= 0) {
      favorites.splice(idx, 1);
      saveFavorites();
      showToast('حذف کر دیا');
    }
  }
  function updateFavUI() {
    favCount.textContent = favorites.length;
    favBtnText.textContent = isFavorite(currentPage) ? 'پسندیدہ ✓' : 'پسندیدہ';
    if (favorites.length === 0) {
      favList.innerHTML = `<div class="fav-empty"><div class="big"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div><div>ابھی کوئی پسندیدہ صفحہ نہیں</div><div style="margin-top:8px;font-size:12px;color:#556;">کسی بھی صفحے پر ⭐ دبائیں — خود بخود محفوظ ہو جائے گا</div></div>`;
      return;
    }
    favList.innerHTML = favorites.map(f => `
      <div class="fav-item" onclick="jumpToFav(${f.page})">
        <span class="fav-star"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></span>
        <div class="fav-info"><div class="fav-page">صفحہ ${getDisplayPage(f.page)}</div><div class="fav-label">کھولنے کے لیے دبائیں</div></div>
        <button class="fav-del" onclick="event.stopPropagation(); removeFavorite(${f.page})" title="حذف"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
    `).join('');
  }
  function jumpToFav(page) { goToPage(page); closeDrawer(); }

  /* DRAWER / SHEET */
  function openDrawer() {
    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('drawerOverlay');
    if (drawer.classList.contains('show')) return;
    drawer.classList.add('show');
    overlay.classList.add('show');
    pushBackHandler(() => {
      drawer.classList.remove('show');
      overlay.classList.remove('show');
    });
  }
  function closeDrawer() {
    const drawer = document.getElementById('drawer');
    if (!drawer.classList.contains('show')) return;
    closeWithBack(() => {
      drawer.classList.remove('show');
      document.getElementById('drawerOverlay').classList.remove('show');
    });
  }

  function openExportSheet() {
    const sheet = document.getElementById('sheet');
    const overlay = document.getElementById('sheetOverlay');
    if (sheet.classList.contains('show')) return;
    sheet.classList.add('show');
    overlay.classList.add('show');
    pushBackHandler(() => {
      sheet.classList.remove('show');
      overlay.classList.remove('show');
    });
  }
  function closeExportSheet() {
    const sheet = document.getElementById('sheet');
    if (!sheet.classList.contains('show')) return;
    closeWithBack(() => {
      sheet.classList.remove('show');
      document.getElementById('sheetOverlay').classList.remove('show');
    });
  }

  /* PDF LOAD */
  async function loadPDF() {
    try {
      loaderText.textContent = 'کتاب لوڈ ہو رہی ہے…';
      const task = pdfjsLib.getDocument({
        url: PDF_URL,
        disableFontFace: true,
        useSystemFonts: false,
        cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
        cMapPacked: true,
        standardFontDataUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/standard_fonts/'
      });
      pdfDoc = await task.promise;
      totalPages = pdfDoc.numPages;
      totalPagesEl.textContent = totalPages;
      const sz = parseFloat(localStorage.getItem(ZOOM_KEY) || '1.2');
      if (!isNaN(sz) && sz >= 0.5 && sz <= 5) scale = sz;
      const last = parseInt(localStorage.getItem(LAST_PAGE_KEY) || '1');
      currentPage = Math.min(Math.max(1, last), totalPages);
      updateZoomBadge();
      await renderPage(currentPage);
      loader.classList.add('hidden');
      showToast('📖 کتاب تیار ہے — زوم ' + Math.round(scale * 100) + '%');
      if (!localStorage.getItem('zoomHintShown')) {
        setTimeout(() => { zoomHint.classList.add('show'); setTimeout(() => zoomHint.classList.remove('show'), 4000); localStorage.setItem('zoomHintShown', '1'); }, 800);
      }
    } catch (err) {
      console.error(err);
      loaderText.innerHTML = `کتاب کھولی نہیں جا سکی<br><small style="color:#a2b0a6;font-size:12px;line-height:2;display:block;margin-top:16px;">PDF کا راستہ چیک کریں۔ موجودہ path: ${escapeHtml(PDF_URL)}</small>`;
    }
  }

  async function renderPage(num) {
    if (!pdfDoc) return;
    if (pageRendering) { pendingPage = num; return; }
    pageRendering = true;
    try {
      const page = await pdfDoc.getPage(num);
      const vp1 = page.getViewport({ scale: 1 });
      const vw = viewerInner.clientWidth;
      const vh = viewerInner.clientHeight;
      const m = 16;
      const fw = (vw - m) / vp1.width;
      const fh = (vh - m) / vp1.height;
      baseScale = Math.max(0.1, Math.min(fw, fh));
      const finalScale = baseScale * scale;
      const vp = page.getViewport({ scale: finalScale });
      const dpr = Math.max(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(vp.width * dpr);
      canvas.height = Math.floor(vp.height * dpr);
      canvas.style.width = Math.floor(vp.width) + 'px';
      canvas.style.height = Math.floor(vp.height) + 'px';
      const rc = canvas.getContext('2d', { alpha: false, desynchronized: false });
      rc.setTransform(dpr, 0, 0, dpr, 0, 0);
      rc.fillStyle = '#ffffff';
      rc.fillRect(0, 0, canvas.width, canvas.height);
      await page.render({ canvasContext: rc, viewport: vp, intent: 'display', background: '#ffffff', enableWebGL: false }).promise;
      try {
        const tc = await page.getTextContent();
        const firstLine = tc.items.slice(0, 8).map(i => i.str).join(' ').trim().substring(0, 60);
        currentPageLabel = firstLine || ('صفحہ ' + num);
      } catch(e) { currentPageLabel = 'صفحہ ' + num; }
      currentPage = num;
      const dn = getDisplayPage(num);
      pageInput.value = dn;
      pageIndicator.textContent = 'صفحہ ' + dn;
      updateFavUI();
      applyPanZoom();
      localStorage.setItem(LAST_PAGE_KEY, num);
      wrap.classList.remove('page-flip');
      void wrap.offsetWidth;
      wrap.classList.add('page-flip');
    } catch (err) { console.error('Render error:', err); }
    finally {
      pageRendering = false;
      if (pendingPage !== null) { const p = pendingPage; pendingPage = null; renderPage(p); }
    }
  }

  /* PAGE OFFSET */
  const PAGE_OFFSET = 2;
  function getDisplayPage(pdfPage) { const d = pdfPage - PAGE_OFFSET; return d < 0 ? '00' : String(d); }
  function getPdfPage(d) { const n = parseInt(d); return isNaN(n) ? 1 : n + PAGE_OFFSET; }

  function goToPage(num) {
    num = parseInt(num);
    if (isNaN(num)) return;
    num = Math.max(1, Math.min(totalPages, num));
    if (num === currentPage) return;
    panX = 0; panY = 0;
    renderPage(num);
  }
  function nextPage() { if (currentPage < totalPages) goToPage(currentPage + 1); else showToast('📖 یہ آخری صفحہ ہے'); }
  function prevPage() { if (currentPage > 1) goToPage(currentPage - 1); else showToast('📖 یہ پہلا صفحہ ہے'); }
  function firstPage() { goToPage(1); }
  function lastPage() { goToPage(totalPages); }

  /* PAGE INPUT */
  pageInput.addEventListener('focus', () => { setTimeout(() => pageInput.select(), 50); });
  pageInput.addEventListener('input', () => {
    let v = pageInput.value;
    const ud = {'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'};
    v = v.replace(/[۰-۹]/g, d => ud[d]);
    v = v.replace(/[^0-9]/g, '');
    pageInput.value = v;
  });
  pageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const dv = parseInt(pageInput.value);
      if (!isNaN(dv)) goToPage(Math.max(1, Math.min(totalPages, dv + PAGE_OFFSET)));
      pageInput.blur();
    }
  });
  pageInput.addEventListener('blur', () => {
    const dv = parseInt(pageInput.value);
    if (!isNaN(dv)) {
      const t = Math.max(1, Math.min(totalPages, dv + PAGE_OFFSET));
      if (t !== currentPage) goToPage(t);
      else pageInput.value = getDisplayPage(currentPage);
    } else { pageInput.value = getDisplayPage(currentPage); }
  });

  const pageClearBtn = document.getElementById('pageClearBtn');

  function updateClearBtn() {
    if (!pageClearBtn) return;
    if (pageInput.value.length > 0 && document.activeElement === pageInput) {
      pageClearBtn.classList.add('show');
    } else {
      pageClearBtn.classList.remove('show');
    }
  }

  pageInput.addEventListener('focus', () => {
    setTimeout(updateClearBtn, 100);
  });
  pageInput.addEventListener('input', updateClearBtn);
  pageInput.addEventListener('blur', () => {
    setTimeout(() => {
      if (pageClearBtn) pageClearBtn.classList.remove('show');
    }, 150);
  });

  function clearPageInput() {
    pageInput.value = '';
    if (pageClearBtn) pageClearBtn.classList.remove('show');
    pageInput.focus();
  }

  /* ZOOM */
  function applyPanZoom() {
    wrap.style.transform = `translate(${panX}px, ${panY}px)`;
    wrap.style.transition = 'transform .08s ease-out';
  }
  function updateZoomBadge() { zoomBadge.textContent = Math.round(scale * 100) + '%'; }
  function saveZoom() { try { localStorage.setItem(ZOOM_KEY, String(scale)); } catch(e) {} updateZoomBadge(); }
  function zoomIn() { scale = Math.min(5, scale * 1.25); saveZoom(); renderPage(currentPage); }
  function zoomOut() { scale = Math.max(0.5, scale / 1.25); panX = 0; panY = 0; saveZoom(); renderPage(currentPage); }
  function resetZoom() { scale = 1.2; panX = 0; panY = 0; saveZoom(); renderPage(currentPage); showToast('🔍 زوم 120%'); }
  function getPanLimits() {
    const r = canvas.getBoundingClientRect();
    return { maxX: Math.max(0, (r.width - viewerInner.clientWidth) / 2), maxY: Math.max(0, (r.height - viewerInner.clientHeight) / 2) };
  }
  function clampPan() {
    const { maxX, maxY } = getPanLimits();
    panX = Math.max(-maxX, Math.min(maxX, panX));
    panY = Math.max(-maxY, Math.min(maxY, panY));
  }

  /* TOUCH */
  viewerInner.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      e.preventDefault();
      isSwiping = false; isPanning = false;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchStartDist = Math.hypot(dx, dy);
      pinchStartScale = scale;
    } else if (e.touches.length === 1) {
      const t = e.touches[0];
      lastTouchX = t.clientX; lastTouchY = t.clientY;
      touchStartX = t.clientX; touchStartY = t.clientY;
      touchStartTime = Date.now();
      isSwiping = false; isPanning = false;
      if (scale <= 1.05) isSwiping = true;
      else {
        const { maxX } = getPanLimits();
        const al = panX <= -maxX + 10;
        const ar = panX >= maxX - 10;
        if (al || ar) isSwiping = true;
        else isPanning = true;
      }
    }
  }, { passive: false });

  viewerInner.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const d = Math.hypot(dx, dy);
      if (pinchStartDist > 0) {
        const r = d / pinchStartDist;
        const ns = Math.max(0.5, Math.min(5, pinchStartScale * r));
        if (Math.abs(ns - scale) > 0.05) {
          scale = ns;
          updateZoomBadge();
          clearTimeout(window._pt);
          window._pt = setTimeout(() => { saveZoom(); renderPage(currentPage); }, 120);
        }
      }
    } else if (e.touches.length === 1) {
      const t = e.touches[0];
      const dx = t.clientX - lastTouchX;
      const dy = t.clientY - lastTouchY;
      if (isPanning) {
        e.preventDefault();
        panX += dx; panY += dy;
        lastTouchX = t.clientX; lastTouchY = t.clientY;
        clampPan();
        wrap.style.transition = 'none';
        wrap.style.transform = `translate(${panX}px, ${panY}px)`;
      } else if (isSwiping) {
        lastTouchX = t.clientX; lastTouchY = t.clientY;
      }
    }
  }, { passive: false });

  viewerInner.addEventListener('touchend', (e) => {
    if (e.touches.length === 0) {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      const dt = Date.now() - touchStartTime;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 500) {
        if (dx > 0) prevPage(); else nextPage();
      }
      isPanning = false; isSwiping = false; pinchStartDist = 0;
      wrap.style.transition = 'transform .12s ease-out';
    }
  });
  viewerInner.addEventListener('touchcancel', () => { isPanning = false; isSwiping = false; pinchStartDist = 0; });

  function updateEdgeHints() {
    if (scale <= 1.05) { edgeHintLeft.classList.remove('show'); edgeHintRight.classList.remove('show'); return; }
    const { maxX } = getPanLimits();
    const al = panX <= -maxX + 10;
    const ar = panX >= maxX - 10;
    edgeHintLeft.classList.toggle('show', al);
    edgeHintRight.classList.toggle('show', ar);
  }
  viewerInner.addEventListener('touchmove', () => { if (isPanning) updateEdgeHints(); }, { passive: true });
  viewerInner.addEventListener('touchend', () => { setTimeout(() => { edgeHintLeft.classList.remove('show'); edgeHintRight.classList.remove('show'); }, 800); });

  /* MOUSE */
  viewerInner.addEventListener('wheel', (e) => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      if (e.deltaY < 0) zoomIn(); else zoomOut();
    }
  }, { passive: false });

  let mouseDown = false, msX = 0, msY = 0;
  viewerInner.addEventListener('mousedown', (e) => {
    if (scale > 1.05) {
      const { maxX } = getPanLimits();
      if (!(panX <= -maxX + 10) && !(panX >= maxX - 10)) {
        mouseDown = true;
        msX = e.clientX - panX;
        msY = e.clientY - panY;
        viewerInner.style.cursor = 'grabbing';
      }
    }
  });
  window.addEventListener('mousemove', (e) => {
    if (mouseDown) {
      panX = e.clientX - msX;
      panY = e.clientY - msY;
      clampPan();
      wrap.style.transition = 'none';
      wrap.style.transform = `translate(${panX}px, ${panY}px)`;
      updateEdgeHints();
    }
  });
  window.addEventListener('mouseup', () => {
    mouseDown = false;
    viewerInner.style.cursor = '';
    wrap.style.transition = 'transform .12s ease-out';
    setTimeout(() => { edgeHintLeft.classList.remove('show'); edgeHintRight.classList.remove('show'); }, 800);
  });

  /* KEYBOARD */
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (isSaving || isDownloadingApk) {
      if (e.key === 'Escape') e.preventDefault();
      return;
    }
    switch (e.key) {
      case 'ArrowRight': case 'ArrowDown': prevPage(); break;
      case 'ArrowLeft': case 'ArrowUp': nextPage(); break;
      case 'Home': firstPage(); break;
      case 'End': lastPage(); break;
      case '+': case '=': zoomIn(); break;
      case '-': zoomOut(); break;
      case '0': resetZoom(); break;
      case 'f': case 'F': toggleFavorite(); break;
      case 'Escape':
        if (document.getElementById('drawer').classList.contains('show')) closeDrawer();
        else if (document.getElementById('sheet').classList.contains('show')) closeExportSheet();
        break;
    }
  });

  /* JPG EXPORT */
  async function saveCurrentPageJPG() {
    if (!pdfDoc || isSaving) return;
    closeExportSheet();
    const pageNumber = currentPage;
    isSaving = true;
    showToast('صفحہ JPG میں محفوظ ہو رہا ہے…');
    try {
      const page = await pdfDoc.getPage(pageNumber);
      const vp = page.getViewport({ scale: 2.0 });
      const off = document.createElement('canvas');
      off.width = vp.width; off.height = vp.height;
      const oc = off.getContext('2d');
      oc.fillStyle = '#ffffff';
      oc.fillRect(0, 0, off.width, off.height);
      await page.render({ canvasContext: oc, viewport: vp, intent: 'print' }).promise;
      const blob = await canvasToBlob(off, 'image/jpeg', 0.92);
      await downloadBlob(blob, `fazail-page-${getDisplayPage(pageNumber)}.jpg`);
      showToast('JPG محفوظ ہو گیا');
    } catch (e) {
      console.error('JPG export failed:', e);
      showToast('صفحہ محفوظ نہیں ہو سکا؛ دوبارہ کوشش کریں۔');
    } finally {
      isSaving = false;
    }
  }

  async function saveAllFavoritesJPG() {
    if (!pdfDoc || isSaving) return;
    if (favorites.length === 0) { showToast('ابھی کوئی پسندیدہ صفحہ نہیں'); return; }
    closeExportSheet();
    const pagesToSave = favorites.slice();
    isSaving = true;
    showToast(`${pagesToSave.length} پسندیدہ صفحات محفوظ ہو رہے ہیں…`);
    let savedCount = 0;
    try {
      for (const favorite of pagesToSave) {
        try {
          const page = await pdfDoc.getPage(favorite.page);
          const vp = page.getViewport({ scale: 3.0 });
          const off = document.createElement('canvas');
          off.width = vp.width; off.height = vp.height;
          const oc = off.getContext('2d');
          oc.fillStyle = '#ffffff';
          oc.fillRect(0, 0, off.width, off.height);
          await page.render({ canvasContext: oc, viewport: vp, intent: 'print' }).promise;
          const blob = await canvasToBlob(off, 'image/jpeg', 0.95);
          await downloadBlob(blob, `صفحہ-${getDisplayPage(favorite.page)}.jpg`);
          savedCount++;
        } catch (e) {
          console.error('Failed to save favorite page:', favorite.page, e);
        }
      }
      if (savedCount === pagesToSave.length) {
        showToast(`${savedCount} صفحات محفوظ ہو گئے`);
      } else {
        showToast(`${savedCount} میں سے ${pagesToSave.length} صفحات محفوظ ہوئے`);
      }
    } finally {
      isSaving = false;
    }
  }

  function canvasToBlob(sourceCanvas, type, quality) {
    return new Promise((resolve, reject) => {
      sourceCanvas.toBlob(blob => {
        if (blob) resolve(blob);
        else reject(new Error('Canvas image could not be created'));
      }, type, quality);
    });
  }

  function blobToDataURL(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error || new Error('Image read failed'));
      reader.readAsDataURL(blob);
    });
  }

  async function downloadBlob(blob, filename) {
    if (typeof FazailNative !== 'undefined' && typeof FazailNative.saveJpg === 'function') {
      try {
        const dataUrl = await blobToDataURL(blob);
        await Promise.resolve(FazailNative.saveJpg(dataUrl, filename));
        return;
      } catch (e) {
        console.warn('Native save unavailable; using browser download:', e);
      }
    }
    await fallbackDownload(blob, filename);
  }

  function fallbackDownload(blob, filename) {
    return new Promise((resolve, reject) => {
      blobToDataURL(blob).then(dataUrl => {
        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = filename;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          if (a.parentNode) a.parentNode.removeChild(a);
          resolve();
        }, 250);
      }).catch(reject);
    });
  }

  /* RESIZE */
  let rTimer;
  window.addEventListener('resize', () => {
    clearTimeout(rTimer);
    rTimer = setTimeout(() => { if (pdfDoc) { panX = 0; panY = 0; renderPage(currentPage); } }, 200);
  });
  window.addEventListener('orientationchange', () => {
    setTimeout(() => { if (pdfDoc) { panX = 0; panY = 0; renderPage(currentPage); } }, 350);
  });

  /* INIT */
  (function initBackHistory() {
    try { history.pushState({ page: 'main' }, ''); } catch(e) {}
  })();

  loadFavorites();
  loadPDF();

  setInterval(() => {
    if (pdfDoc) {
      const fav = isFavorite(currentPage);
      const btn = document.getElementById('favBtn');
      if (fav) {
        btn.style.background = 'linear-gradient(180deg, var(--star), #e0a800)';
        btn.style.color = '#0a1f44';
        btn.style.borderColor = 'var(--star)';
      } else {
        btn.style.background = '';
        btn.style.color = '';
        btn.style.borderColor = '';
      }
    }
  }, 500);
</script>
